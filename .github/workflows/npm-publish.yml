name: CI and NPM Publish

on:
    push:
        branches:
            - 'main'
            - '**'
        tags:
            - 'v*'

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            redis:
                image: redis:latest
                ports:
                    - 6379:6379
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm action
              uses: pnpm/action-setup@v6
              with:
                  # No `version` here on purpose: `packageManager` in
                  # package.json is the single source of truth, and pinning both
                  # fails with ERR_PNPM_BAD_PM_VERSION.
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies using pnpm
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: pnpm run test

        # - name: Upload coverage to Codecov
        #   uses: codecov/codecov-action@v4
        #   with:
        #     token: ${{ secrets.CODECOV_TOKEN }}
        #     fail_ci_if_error: true

    publish_npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        needs: test
        if: success() && startsWith(github.ref, 'refs/tags/')
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm action
              uses: pnpm/action-setup@v6
              with:
                  # No `version` here on purpose: `packageManager` in
                  # package.json is the single source of truth, and pinning both
                  # fails with ERR_PNPM_BAD_PM_VERSION.
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml
                  registry-url: 'https://registry.npmjs.org'

            - name: Update npm (required for provenance)
              run: npm install -g npm@latest

            - name: Install dependencies using pnpm
              run: pnpm install --frozen-lockfile

            - name: Build package
              run: pnpm run build # Runs "rimraf dist && tsc"

            # Publish via npm directly rather than `pnpm publish --provenance`:
            # pnpm's provenance support shells out to npm internally and
            # forwards pnpm-only flags like --no-git-checks along with it,
            # which newer npm (EUNKNOWNCONFIG) rejects as an unknown flag.
            - name: 'Guard: tag/version match, publish only if new'
              id: version
              run: |
                  NAME=$(node -p "require('./package.json').name")
                  VERSION=$(node -p "require('./package.json').version")
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  if [ "$TAG_VERSION" != "$VERSION" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME points at a commit whose package.json says $VERSION. Version bumps must be committed BEFORE tagging: bump package.json, commit, delete + re-create the tag, push."
                    exit 1
                  fi
                  if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::$NAME@$VERSION is already on npm — publish skipped (tag re-push or replayed run)"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "Publishing $NAME@$VERSION"
                  fi

            - name: Publish to NPM
              if: steps.version.outputs.exists != 'true'
              run: npm publish --provenance
